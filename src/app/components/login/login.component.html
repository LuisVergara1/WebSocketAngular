<main class="entry">
  <section class="room-card" aria-labelledby="entry-title">
    <div class="chat-mark" aria-hidden="true"><span></span></div>
    <h1 id="entry-title">Chat rooms</h1>
    <p class="intro">Elige un código nuevo o usa el que te compartieron.</p>

    <form (ngSubmit)="login()">
      <label for="room-code">Código de sala</label>
      <input class="chat-input" id="room-code" name="roomCode" type="text"
        [(ngModel)]="roomIdInput" [readOnly]="!!invitedRoomId" placeholder="p. ej. 123 o coffee-chat" required />
      <label for="display-name">Nombre visible (opcional)</label>
      <input class="chat-input" id="display-name" name="displayName" type="text"
        [(ngModel)]="displayName" maxlength="24" autocomplete="nickname"
        placeholder="Invitado aleatorio si lo dejas vacío" />
      <button class="primary-button" type="submit" [disabled]="!roomIdInput.trim()">
        Entrar a la sala <span aria-hidden="true">→</span>
      </button>
    </form>

    <p class="entry-note">No necesitas una cuenta.</p>
  </section>
</main>
